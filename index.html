<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f2b880" />
    <title>Cruiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-phase="day">
    <canvas id="scene"></canvas>

    <header id="topbar">
      <a class="logo" href="/" aria-label="Cruiz">Cruiz</a>
      <nav>
        <button type="button" class="nav-link" data-theme-set="day">Day</button>
        <button type="button" class="nav-link" data-theme-set="sunset">Sunset</button>
        <button type="button" class="nav-link" data-theme-set="night">Night</button>
        <button type="button" id="btn-phase" class="icon-btn" aria-label="시간대 바꾸기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-day" /></svg>
        </button>
        <button type="button" id="btn-sound" class="icon-btn" aria-label="소리" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="sound-on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="sound-off" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" id="btn-settings" class="icon-btn" aria-label="설정" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.4h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
      </nav>
      <div id="settings-panel" hidden>
        <ul class="keys">
          <li><kbd>←</kbd><kbd>→</kbd> 핸들</li>
          <li><kbd>↑</kbd><kbd>↓</kbd> 속도</li>
          <li><kbd>A</kbd> 자동 주행</li>
          <li><kbd>M</kbd> 매뉴얼 (차선 유지 끄기)</li>
          <li><kbd>C</kbd> 카메라</li>
          <li><kbd>V</kbd> 차 바꾸기</li>
        </ul>
        <p class="touch-hint">화면 왼쪽/오른쪽을 눌러 핸들을 돌리고, 오른쪽 아래 페달로 속도를 바꿔요. MANUAL을 켜면 차선 유지가 꺼져 굽이마다 직접 핸들을 돌려야 해요</p>
        <label class="toggle"><input type="checkbox" id="opt-fps" /> FPS 표시</label>
      </div>
      <div id="fps" hidden></div>
    </header>

    <div id="hud" hidden>
      <div class="stat"><span id="hud-speed">0</span><small>km/h</small></div>
      <div class="stat"><span id="hud-distance">0.0</span><small>km</small></div>
      <div id="hud-mode" class="badge" hidden>AUTO</div>
      <button type="button" id="btn-auto" class="hud-btn touch-only" aria-pressed="false">AUTO</button>
      <button type="button" id="btn-manual" class="hud-btn touch-only" aria-pressed="false">MANUAL</button>
      <button type="button" id="btn-camera" class="icon-btn hud-btn touch-only" aria-label="카메라 바꾸기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 4.5h6l1.4 2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.5a2 2 0 0 1 2-2h2.6L9 4.5zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0-2a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
      </button>
    </div>

    <div id="pedals" class="touch-only" hidden>
      <button type="button" id="pedal-down" class="pedal pedal-brake" aria-label="브레이크"><i></i><i></i><i></i><i></i></button>
      <button type="button" id="pedal-up" class="pedal pedal-gas" aria-label="가속"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></button>
    </div>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="icon-day" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="icon-sunset" viewBox="0 0 24 24"><path fill="currentColor" d="M6.5 16a5.5 5.5 0 0 1 11 0z"/><path d="M3 19.5h18M12 5v2.5M5.2 8.7l1.6 1.6M18.8 8.7l-1.6 1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="icon-night" viewBox="0 0 24 24"><path fill="currentColor" d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol>
    </svg>

    <div id="garage" hidden>
      <div id="garage-panel" class="car-picker" role="radiogroup" aria-label="차종 선택" hidden></div>
      <button type="button" id="garage-button" aria-expanded="false" aria-controls="garage-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 11l1.6-4.2A2 2 0 0 1 8.5 5.5h7a2 2 0 0 1 1.9 1.3L19 11a2 2 0 0 1 2 2v3.5a1 1 0 0 1-1 1h-1a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H4a1 1 0 0 1-1-1V13a2 2 0 0 1 2-2zm2.2 0h9.6l-1.2-3.3a.5.5 0 0 0-.5-.3H8.9a.5.5 0 0 0-.5.3L7.2 11zM7 15.2a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4zm10 0a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4z"/></svg>
        <span id="garage-name">Classic</span>
      </button>
    </div>

    <main id="start">
      <section class="hero">
        <h1 id="hero-title">Just Drive</h1>
        <p id="hero-sub">Beautiful roads, brighter days.</p>
        <button id="start-button" type="button">Start Driving <span aria-hidden="true">→</span></button>
        <div id="car-picker" class="car-picker" role="radiogroup" aria-label="차종 선택"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
